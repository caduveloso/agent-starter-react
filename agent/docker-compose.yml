services:
  # Agent 1 - The Analyst
  agent1-analyst:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - .:/app
    network_mode: "host"
    restart: unless-stopped
    command: ["python", "agent1_analyst.py", "dev"]

  # Agent 2 - The Creative
  agent2-creative:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - .:/app
    network_mode: "host"
    restart: unless-stopped
    command: ["python", "agent2_creative.py", "dev"]
