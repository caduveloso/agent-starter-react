services:
  bithuman-agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - .:/app
    network_mode: "host"
    restart: unless-stopped
    # Change the command to run different agent versions:
    # Default: Single agent
    # command: ["python", "agent.py", "dev"]
    # Multi-agent with dual avatars and turn coordination (ACTIVE):
    command: ["python", "multi_agent_final.py", "dev"]
